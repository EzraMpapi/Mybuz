# GitHub Actions workflow to build a Vite app and deploy to Vercel using the Vercel CLI.
# IMPORTANT: Do NOT store secrets in this file. Create repository secrets named:
# - VERCEL_TOKEN (your Vercel personal token)
# - VITE_SUPABASE_URL (your Supabase project URL)
# - VITE_SUPABASE_ANON_KEY (your Supabase anon key)
# Once the secrets are set, merge this branch to trigger CI on your default branch or run it manually.

name: Build and Deploy to Vercel

on:
  push:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Deploy to Vercel
        run: |
          # The --prod flag deploys to production. Remove if you want preview deployments only.
          # --confirm prevents interactive prompts in CI.
          vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --confirm
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
